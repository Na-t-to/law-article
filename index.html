<!doctype html>
<html lang="ja">
  <head>

    <div class="page-shell">
      <header class="site-header">

        <nav class="main-nav" aria-label="メインナビゲーション">
          <a class="nav-link is-active" href="#topics">テーマ</a>
          <a class="nav-link" href="#changes">最近の更新</a>

      <main id="top">

          <div class="section-heading"><h2 id="changesTitle">最近の更新</h2><span class="section-count">一次資料 → 影響論点 → 現在地</span></div>

      <footer class="site-footer"><div><strong>LAW / INDEX</strong><span>テーマを探す → 現在の整理を読む → 必要なら根拠へ。</span></div><a href="#top">ページ上部へ <span>↑</span></a></footer>
