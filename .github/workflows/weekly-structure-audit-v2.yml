name: Weekly structure audit v2
on:
  push:
    branches: [audit/structure-20260913-current]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate audit metrics
        run: |
          mkdir -p audit-output-v2
          node scripts/validate-data.mjs > audit-output-v2/validator.json 2> audit-output-v2/validator-warnings.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm'; import path from 'node:path';
          const c={window:{},URL};vm.createContext(c);vm.runInContext(fs.readFileSync('data/manifest.js','utf8'),c);const manifest=c.window.LAW_INDEX_DATA_FILES||{};for(const f of Object.values(manifest).flat().map(x=>x.split('?')[0]))vm.runInContext(fs.readFileSync('data/'+f,'utf8'),c,{filename:f});
          const topics=c.window.TOPIC_DATA||[],sources=c.window.SOURCE_DATA||[],updates=c.window.UPDATE_DATA||[],events=c.window.REFORM_EVENT_DATA||[],articles=c.window.ARTICLE_DATA||[];const adopted=articles.filter(a=>a.status==='adopted'),unique=c.window.uniqueKnowledgeArticles?.(articles)||articles;
          const normUrl=v=>{try{const u=new URL(v);u.protocol='https:';u.hash='';for(const k of [...u.searchParams.keys()])if(/^utm_/i.test(k)||['fbclid','gclid','yclid'].includes(k))u.searchParams.delete(k);u.hostname=u.hostname.toLowerCase();u.pathname=u.pathname.replace(/\/+$/,'')||'/';u.searchParams.sort();return u.toString()}catch{return String(v||'').trim()}};const normText=v=>String(v||'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'');
          const group=(items,keyFn)=>{const m=new Map();for(const x of items){const k=keyFn(x);if(!k)continue;if(!m.has(k))m.set(k,[]);m.get(k).push(x)}return [...m].filter(([,v])=>v.length>1).map(([key,items])=>({key,items}))};const brief=a=>({id:a.id,title:a.title,url:a.url,publisher:a.publisher,publishedAt:a.publishedAt,collectedAt:a.collectedAt,relatedTopics:a.relatedTopics,relatedIssues:a.relatedIssues,primarySourceIds:a.primarySourceIds,reformEventId:a.reformEventId});
          const dup={raw:articles.length,unique:unique.length,ids:group(articles,a=>a.id),exactUrls:group(articles,a=>a.url),canonicalUrls:group(articles,a=>normUrl(a.url)),titlePublisherDate:group(articles,a=>[normText(a.title),normText(a.publisher),a.publishedAt||''].join('|')),nearTitlePublisher:group(articles,a=>[normText(a.title),normText(a.publisher)].join('|')).filter(g=>new Set(g.items.map(x=>x.url)).size>1),sourceIds:group(sources,s=>s.id),sourceCanonicalUrls:group(sources,s=>normUrl(s.url))};for(const k of ['ids','exactUrls','canonicalUrls','titlePublisherDate','nearTitlePublisher'])dup[k]=dup[k].map(g=>({...g,items:g.items.map(brief)}));for(const k of ['sourceIds','sourceCanonicalUrls'])dup[k]=dup[k].map(g=>({...g,items:g.items.map(s=>({id:s.id,title:s.title,url:s.url}))}));fs.writeFileSync('audit-output-v2/duplicates.json',JSON.stringify(dup,null,2));
          const categoryCounts={};for(const t of topics)for(const x of t.categories||[])categoryCounts[x]=(categoryCounts[x]||0)+1;const ta=new Map(topics.map(t=>[t.slug,new Set()]));for(const a of adopted)for(const s of a.relatedTopics||[])ta.get(s)?.add(a.id);const jac=(a,b)=>{const u=new Set([...a,...b]);if(!u.size)return 0;let i=0;for(const x of a)if(b.has(x))i++;return i/u.size};const overlaps=[];for(let i=0;i<topics.length;i++)for(let j=i+1;j<topics.length;j++){const a=topics[i],b=topics[j],aj=jac(ta.get(a.slug)||new Set(),ta.get(b.slug)||new Set()),sj=jac(new Set(a.sourceIds||[]),new Set(b.sourceIds||[]));if(aj>=.25||sj>=.3)overlaps.push({a:a.slug,aTitle:a.title,b:b.slug,bTitle:b.title,articleJaccard:+aj.toFixed(3),sourceJaccard:+sj.toFixed(3),sharedCategories:(a.categories||[]).filter(x=>(b.categories||[]).includes(x))})}overlaps.sort((a,b)=>b.articleJaccard+b.sourceJaccard-a.articleJaccard-a.sourceJaccard);fs.writeFileSync('audit-output-v2/topics.json',JSON.stringify({count:topics.length,categoryCounts,singletons:Object.entries(categoryCounts).filter(([,n])=>n===1),overlaps},null,2));
          const eventFor=a=>{if(a.reformEventId)return events.find(e=>e.id===a.reformEventId)||null;const p=a.primarySourceIds||[];const m=events.filter(e=>(e.articleIds||[]).includes(a.id)||(e.matchSourceIds||[]).some(id=>p.includes(id)));return m.length===1?m[0]:null};const rows=adopted.map(a=>{const e=eventFor(a),info=c.window.getLegalReformInfo?.(a,topics)||{isReform:false},law=e?{id:e.lawId,label:e.lawLabel}:c.window.getLegalReformLaw?.(a,topics);return{a,e,info,law}}).filter(x=>x.e||x.info.isReform);const gm=new Map();for(const r of rows){const id=r.e?'event-'+r.e.id:'legacy-'+(r.law?.id||'unknown');if(!gm.has(id))gm.set(id,{id,type:r.e?'event':'legacy',eventId:r.e?.id||null,title:r.e?.title||r.law?.label||'不明',lawId:r.e?.lawId||r.law?.id||null,lawLabel:r.e?.lawLabel||r.law?.label||null,articles:[],sourceIds:new Set(),topics:new Set()});const g=gm.get(id);g.articles.push(r.a.id);for(const x of r.a.primarySourceIds||[])g.sourceIds.add(x);for(const x of r.a.relatedTopics||[])g.topics.add(x)}const groups=[...gm.values()].map(g=>({...g,sourceIds:[...g.sourceIds],topics:[...g.topics]}));const suspects=[];for(const e of groups.filter(g=>g.type==='event'))for(const l of groups.filter(g=>g.type==='legacy')){const lm=normText(e.lawLabel)===normText(l.lawLabel)||normText(e.title).includes(normText(l.lawLabel))||normText(l.title).includes(normText(e.lawLabel)),tj=jac(new Set(e.topics),new Set(l.topics)),sj=jac(new Set(e.sourceIds),new Set(l.sourceIds));if(lm||tj>=.5||sj>=.25)suspects.push({event:e.id,eventTitle:e.title,legacy:l.id,legacyTitle:l.title,labelMatch:lm,topicJaccard:+tj.toFixed(3),sourceJaccard:+sj.toFixed(3),eventArticles:e.articles,legacyArticles:l.articles})}fs.writeFileSync('audit-output-v2/reforms.json',JSON.stringify({articles:rows.length,eventCount:events.length,linked:rows.filter(x=>x.e).length,unlinked:rows.filter(x=>!x.e).map(x=>brief(x.a)),groups,suspects,timing:events.map(e=>({id:e.id,title:e.title,lawLabel:e.lawLabel,eventType:e.eventType,effectiveDateStatus:e.effectiveDateStatus,effectiveDate:e.effectiveDate,effectiveDates:e.effectiveDates,effectiveDateNote:e.effectiveDateNote,effectiveDateSourceIds:e.effectiveDateSourceIds,timing:c.window.getLegalReformEventTiming?.(e)||null}))},null,2));
          fs.writeFileSync('audit-output-v2/knowledge.json',JSON.stringify(c.window.getKnowledgeAudit?.(topics,articles,updates)||{},null,2));
          const html=[];const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory()){if(!p.startsWith('.git'))walk(p)}else if(p.endsWith('.html'))html.push(p)}};walk('.');const broken=[],badNav=[];let footerTop=0,floating=0;for(const f of html){const t=fs.readFileSync(f,'utf8');for(const m of t.matchAll(/href=["']([^"']+)["']/g)){const h=m[1];if(/^(https?:|mailto:|tel:|javascript:|#)/.test(h))continue;const q=decodeURIComponent(h.split(/[?#]/)[0]);if(!q)continue;const target=path.normalize(path.join(path.dirname(f),q));if(!fs.existsSync(target))broken.push({file:f,href:h,target})}const nav=t.match(/<nav class="main-nav"[\s\S]*?<\/nav>/)?.[0]||'',order=[...nav.matchAll(/>(新着|記事一覧|テーマ|法改正)</g)].map(m=>m[1]);if(order.length&&order.join('|')!=='新着|記事一覧|テーマ|法改正')badNav.push({file:f,order});footerTop+=(t.match(/site-footer[\s\S]{0,400}ページ上部へ/g)||[]).length;floating+=(t.match(/class="floating-top"/g)||[]).length}fs.writeFileSync('audit-output-v2/internal.json',JSON.stringify({htmlFiles:html.length,broken,badNav,footerTop,floating},null,2));
          const urls=[...new Set([...articles,...sources].map(x=>x.url).filter(Boolean))],links=[];let cur=0;async function w(){while(cur<urls.length){const url=urls[cur++];try{const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(10000),headers:{'User-Agent':'LAW-INDEX-Link-Audit/1.0','Accept':'text/html,application/pdf,*/*;q=0.8'}});const o={url,status:r.status,finalUrl:r.url,type:r.headers.get('content-type')||''};if(o.type.includes('text/html')){const t=(await r.text()).slice(0,200000);o.title=t.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.replace(/\s+/g,' ').trim()||'';o.canonical=t.match(/<link[^>]*rel=["']canonical["'][^>]*href=["']([^"']+)/i)?.[1]||''}else await r.body?.cancel();links.push(o)}catch(e){links.push({url,status:null,error:e.message})}}}await Promise.all(Array.from({length:24},w));fs.writeFileSync('audit-output-v2/external.json',JSON.stringify(links,null,2));
          const pp=['index.html','articles.html','article.html','topics.html','reforms.html','data/manifest.js','data/schema.js','data/reform-policy.js','data/topics.js','data/sources.js','data/updates.js','data/reforms.js'],pub=[];for(const p of pp){try{const r=await fetch('https://na-t-to.github.io/law-article/'+p+'?audit='+Date.now(),{signal:AbortSignal.timeout(15000)}),b=await r.text();pub.push({path:p,status:r.status,matchesMain:b===fs.readFileSync(p,'utf8'),length:b.length})}catch(e){pub.push({path:p,status:null,error:e.message})}}fs.writeFileSync('audit-output-v2/public.json',JSON.stringify(pub,null,2));
          const warns=fs.readFileSync('audit-output-v2/validator-warnings.txt','utf8').split('\n').filter(Boolean);const summary={baseMain:'2a912a86966626d647e9f1afafd4083c400c24b8',topics:topics.length,issues:topics.reduce((n,t)=>n+(t.issues||[]).length,0),sources:sources.length,updates:updates.length,reformEvents:events.length,articles:articles.length,adopted:adopted.length,uniqueArticles:unique.length,manifestArticleFiles:(manifest.articles||[]).length,categories:categoryCounts,duplicates:{ids:dup.ids.length,exactUrls:dup.exactUrls.length,canonicalUrls:dup.canonicalUrls.length,titlePublisherDate:dup.titlePublisherDate.length,nearTitlePublisher:dup.nearTitlePublisher.length,sourceIds:dup.sourceIds.length,sourceCanonicalUrls:dup.sourceCanonicalUrls.length},reforms:{articles:rows.length,linked:rows.filter(x=>x.e).length,unlinked:rows.filter(x=>!x.e).length,groups:groups.length,suspects:suspects.length},internal:{broken:broken.length,badNav:badNav.length,footerTop,floating},validatorWarnings:warns.length,external:{total:links.length,ok:links.filter(x=>x.status>=200&&x.status<400).length,restricted:links.filter(x=>[401,403,429].includes(x.status)).length,notFound:links.filter(x=>[404,410].includes(x.status)).length,server:links.filter(x=>x.status>=500).length,network:links.filter(x=>x.status==null).length},public:{checked:pub.length,ok:pub.filter(x=>x.status===200).length,matches:pub.filter(x=>x.matchesMain).length,mismatches:pub.filter(x=>x.status===200&&!x.matchesMain).map(x=>x.path)}};fs.writeFileSync('audit-output-v2/summary.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-structure-audit-20260913-v2
          path: audit-output-v2
          retention-days: 7
