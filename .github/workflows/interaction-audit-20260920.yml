name: Interaction audit 2026-09-20
on:
  push:
    branches: [audit/validate-cleanup-20260920]
permissions:
  contents: read
jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Search, filter, detail and redirect smoke
        shell: bash
        run: |
          mkdir -p interaction-output
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const B='https://na-t-to.github.io/law-article/'; const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1280,height:800}});const out={};
          await p.goto(B+'articles.html?audit=15ad3544',{waitUntil:'networkidle'});const initial=await p.locator('#articleLibrary .article-row').count();await p.locator('#articleSearch').fill('ランサムウェア');await p.waitForTimeout(150);const searched=await p.locator('#articleLibrary .article-row').count();out.search={initial,searched,empty:await p.locator('#articleLibrary .empty-inline').count()};if(!(initial>searched&&searched>0))throw new Error('article search did not filter');
          await p.goto(B+'topics.html?audit=15ad3544',{waitUntil:'networkidle'});const total=await p.locator('#topicList .topic-row').count();const btn=p.locator('#fieldFilters [data-field]').first();const label=await btn.textContent();await btn.click();await p.waitForTimeout(150);const filtered=await p.locator('#topicList .topic-row').count();out.topicFilter={total,filtered,label};if(!(total>filtered&&filtered>0))throw new Error('topic field filter did not filter');
          await p.goto(B+'article.html?id=article-tmi-aml-identity-2026&audit=15ad3544',{waitUntil:'networkidle'});out.articleDetail={title:await p.title(),text:(await p.locator('#articlePage').innerText()).slice(0,300)};if((await p.locator('#articlePage').innerText()).includes('見つかりません'))throw new Error('article detail missing');
          await p.goto(B+'topics/customer-harassment-2026.html?audit=15ad3544',{waitUntil:'networkidle'});out.redirect={url:p.url(),title:await p.title()};if(!p.url().includes('/topics/customer-harassment.html'))throw new Error('legacy topic redirect failed');
          await p.goto(B+'reforms.html?audit=15ad3544',{waitUntil:'networkidle'});out.reforms={groups:await p.locator('.reform-law-index > *').count(),text:(await p.locator('#reformList').innerText()).slice(0,300)};if(!(await p.locator('#reformList').innerText()).trim())throw new Error('reform list empty');
          fs.writeFileSync('interaction-output/result.json',JSON.stringify(out,null,2));await b.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction-audit-20260920
          path: interaction-output
          retention-days: 3
