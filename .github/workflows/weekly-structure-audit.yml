name: Weekly isolated structure audit
on:
  push:
    branches: [audit/weekly-20260920-1253d2d]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run validator and structural audit
        shell: bash
        run: |
          set +e
          mkdir -p audit-output
          node scripts/validate-data.mjs > audit-output/validator-stdout.txt 2> audit-output/validator-stderr.txt
          echo $? > audit-output/validator-exit.txt
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { execSync } from 'node:child_process';

          const context = { window: {}, URL };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('data/manifest.js','utf8'), context, {filename:'data/manifest.js'});
          const manifest = context.window.LAW_INDEX_DATA_FILES || {};
          const listed = Object.values(manifest).flat().map(x => x.split('?')[0]);
          for (const file of listed) vm.runInContext(fs.readFileSync(`data/${file}`,'utf8'), context, {filename:`data/${file}`});

          const topics = context.window.TOPIC_DATA || [];
          const sources = context.window.SOURCE_DATA || [];
          const updates = context.window.UPDATE_DATA || [];
          const events = context.window.REFORM_EVENT_DATA || [];
          const articles = context.window.ARTICLE_DATA || [];
          const uniqueArticles = context.window.uniqueKnowledgeArticles ? context.window.uniqueKnowledgeArticles(articles) : articles;

          const normUrl = (value) => {
            try {
              const u = new URL(value);
              u.protocol='https:'; u.hash=''; u.hostname=u.hostname.toLowerCase();
              for (const key of [...u.searchParams.keys()]) if (/^utm_/i.test(key) || ['fbclid','gclid','yclid'].includes(key)) u.searchParams.delete(key);
              u.searchParams.sort(); u.pathname=u.pathname.replace(/\/+$/,'') || '/';
              return u.toString();
            } catch { return String(value||'').trim(); }
          };
          const normText = (value) => String(value||'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'');
          const groupBy = (items, keyFn) => {
            const m=new Map();
            for(const item of items){const k=keyFn(item); if(!k) continue; const arr=m.get(k)||[]; arr.push(item); m.set(k,arr);}
            return [...m.entries()].filter(([,v])=>v.length>1).map(([key,items])=>({key,items}));
          };
          const slimArticle = a => ({id:a.id,title:a.title,url:a.url,publisher:a.publisher||a.sourceLabel||'',author:a.author||'',publishedAt:a.publishedAt||'',collectedAt:a.collectedAt||'',relatedTopics:a.relatedTopics||[],relatedIssues:a.relatedIssues||[],primarySourceIds:a.primarySourceIds||[],reformEventId:a.reformEventId||null});
          const slimSource = s => ({id:s.id,title:s.title||s.label||'',url:s.url});

          const articleIdDup = groupBy(articles,a=>a.id).map(g=>({...g,items:g.items.map(slimArticle)}));
          const articleUrlDup = groupBy(articles,a=>normUrl(a.url)).map(g=>({...g,items:g.items.map(slimArticle)}));
          const sourceIdDup = groupBy(sources,s=>s.id).map(g=>({...g,items:g.items.map(slimSource)}));
          const sourceUrlDup = groupBy(sources,s=>normUrl(s.url)).map(g=>({...g,items:g.items.map(slimSource)}));
          const titlePublisherDateDup = groupBy(articles,a=>[normText(a.title),normText(a.publisher||a.sourceLabel),a.publishedAt||''].join('|'))
            .filter(g=>g.key.split('|')[0]).map(g=>({...g,items:g.items.map(slimArticle)}));
          const titlePublisherDup = groupBy(articles,a=>[normText(a.title),normText(a.publisher||a.sourceLabel)].join('|'))
            .filter(g=>g.key.split('|')[0] && !titlePublisherDateDup.some(x=>x.key.startsWith(g.key+'|'))).map(g=>({...g,items:g.items.map(slimArticle)}));

          const catCounts = new Map();
          const topicCats = [];
          for (const t of topics) {
            const cats = Array.isArray(t.categories) ? t.categories : t.category ? [t.category] : Array.isArray(t.fields) ? t.fields : [];
            topicCats.push({slug:t.slug,title:t.title,categories:cats});
            for(const c of cats) catCounts.set(c,(catCounts.get(c)||0)+1);
          }

          const articlesByTopic = new Map(topics.map(t=>[t.slug,new Set()]));
          for(const a of uniqueArticles) for(const slug of a.relatedTopics||[]) articlesByTopic.get(slug)?.add(a.id);
          const jaccard=(a,b)=>{const A=new Set(a),B=new Set(b); if(!A.size&&!B.size)return 0; let i=0; for(const x of A) if(B.has(x)) i++; return i/(A.size+B.size-i);};
          const topicPairs=[];
          for(let i=0;i<topics.length;i++) for(let j=i+1;j<topics.length;j++){
            const a=topics[i],b=topics[j];
            const artJ=jaccard(articlesByTopic.get(a.slug)||[],articlesByTopic.get(b.slug)||[]);
            const srcJ=jaccard(a.sourceIds||[],b.sourceIds||[]);
            const catJ=jaccard(topicCats.find(x=>x.slug===a.slug)?.categories||[],topicCats.find(x=>x.slug===b.slug)?.categories||[]);
            if(artJ>=0.4 || srcJ>=0.4 || (artJ>=0.25 && srcJ>=0.25)) topicPairs.push({a:{slug:a.slug,title:a.title},b:{slug:b.slug,title:b.title},articleJaccard:+artJ.toFixed(3),sourceJaccard:+srcJ.toFixed(3),categoryJaccard:+catJ.toFixed(3),articleCounts:[articlesByTopic.get(a.slug)?.size||0,articlesByTopic.get(b.slug)?.size||0],sourceCounts:[(a.sourceIds||[]).length,(b.sourceIds||[]).length]});
          }
          topicPairs.sort((x,y)=>(y.articleJaccard+y.sourceJaccard)-(x.articleJaccard+x.sourceJaccard));

          const matchingEvents = article => {
            const primary=Array.isArray(article.primarySourceIds)?article.primarySourceIds:[];
            return events.filter(e=>(e.articleIds||[]).includes(article.id)||(e.matchSourceIds||[]).some(id=>primary.includes(id)));
          };
          const resolvedEvent = article => {
            if(article.reformEventId) return events.find(e=>e.id===article.reformEventId)||null;
            const m=matchingEvents(article); return m.length===1?m[0]:null;
          };
          const legal = uniqueArticles.filter(a=>resolvedEvent(a) || context.window.getLegalReformInfo?.(a,topics)?.isReform);
          const unlinked = legal.filter(a=>!resolvedEvent(a));
          const eventDupPairs=[];
          for(let i=0;i<events.length;i++) for(let j=i+1;j<events.length;j++){
            const a=events[i],b=events[j]; if(a.lawId!==b.lawId) continue;
            const srcJ=jaccard(a.sourceIds||[],b.sourceIds||[]), topicJ=jaccard(a.relatedTopics||[],b.relatedTopics||[]);
            const titleA=normText(a.title),titleB=normText(b.title);
            const titleSimilar = titleA===titleB || titleA.includes(titleB) || titleB.includes(titleA);
            if(srcJ>0 || topicJ>=0.5 || titleSimilar) eventDupPairs.push({a:{id:a.id,title:a.title,lawId:a.lawId},b:{id:b.id,title:b.title,lawId:b.lawId},sourceJaccard:+srcJ.toFixed(3),topicJaccard:+topicJ.toFixed(3),titleSimilar});
          }
          const legacyCanonicalSuspects=[];
          for(const a of unlinked){
            const text=[a.title,a.sourceLabel,a.publisher].filter(Boolean).join(' ');
            for(const e of events){
              let score=0; const reasons=[];
              if(e.lawLabel && text.includes(e.lawLabel)){score+=2; reasons.push('lawLabel');}
              const topicOverlap=(a.relatedTopics||[]).filter(x=>(e.relatedTopics||[]).includes(x)); if(topicOverlap.length){score++; reasons.push('relatedTopics');}
              const srcOverlap=(a.primarySourceIds||[]).filter(x=>(e.sourceIds||[]).includes(x)); if(srcOverlap.length){score+=2; reasons.push('sourceIds');}
              if(score>=2) legacyCanonicalSuspects.push({article:slimArticle(a),event:{id:e.id,title:e.title,lawId:e.lawId,lawLabel:e.lawLabel},score,reasons,topicOverlap,srcOverlap});
            }
          }
          legacyCanonicalSuspects.sort((a,b)=>b.score-a.score);

          const audit = context.window.getKnowledgeAudit ? context.window.getKnowledgeAudit(topics,articles,updates) : null;
          const manifestCounts=Object.fromEntries(Object.entries(manifest).map(([k,v])=>[k,v.length]));
          const actualDataFiles=fs.readdirSync('data').filter(f=>f.endsWith('.js'));
          const nav={};
          for(const p of ['index.html','articles.html','topics.html','reforms.html','article.html']){
            const html=fs.readFileSync(p,'utf8');
            nav[p]=[...html.matchAll(/<a class="nav-link(?: is-active)?" href="([^"]+)">([^<]+)<\/a>/g)].map(m=>({href:m[1],label:m[2]}));
          }

          const report={
            commit:execSync('git rev-parse HEAD').toString().trim(),
            windowFunctions:Object.keys(context.window).filter(k=>/Reform|Knowledge|Verification|Legal/i.test(k)).sort(),
            counts:{topics:topics.length,sources:sources.length,updates:updates.length,reformEvents:events.length,rawArticles:articles.length,uniqueArticles:uniqueArticles.length,legalReformArticles:legal.length,reformEventLinked:legal.filter(a=>resolvedEvent(a)).length,reformEventUnlinked:unlinked.length},
            manifestCounts,actualDataFiles:actualDataFiles.length,
            duplicates:{articleId:articleIdDup,articleCanonicalUrl:articleUrlDup,sourceId:sourceIdDup,sourceCanonicalUrl:sourceUrlDup,titlePublisherDate:titlePublisherDateDup,titlePublisher:titlePublisherDup},
            categories:[...catCounts].sort((a,b)=>b[1]-a[1]).map(([category,count])=>({category,count})),
            categoryCount:catCounts.size,
            topicSimilarityCandidates:topicPairs.slice(0,60),
            eventDuplicateCandidates:eventDupPairs,
            legacyCanonicalSuspects:legacyCanonicalSuspects.slice(0,100),
            unlinkedLegalReforms:unlinked.map(slimArticle),
            knowledgeAudit:audit,
            nav
          };
          fs.writeFileSync('audit-output/audit.json',JSON.stringify(report,null,2));
          NODE

      - name: Check external URLs and published site
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const c={window:{},URL}; vm.createContext(c); vm.runInContext(fs.readFileSync('data/manifest.js','utf8'),c);
          const manifest=c.window.LAW_INDEX_DATA_FILES||{}; for(const f of Object.values(manifest).flat()) vm.runInContext(fs.readFileSync('data/'+f.split('?')[0],'utf8'),c);
          const urls=[...new Set([...(c.window.ARTICLE_DATA||[]),...(c.window.SOURCE_DATA||[])].map(x=>x.url).filter(Boolean))];
          const results=[]; let cursor=0;
          async function worker(){while(cursor<urls.length){const url=urls[cursor++];try{const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(10000),headers:{'User-Agent':'LAW-INDEX-Weekly-Audit/1.0','Accept':'text/html,application/xhtml+xml,application/pdf,*/*;q=0.8'}}); results.push({url,status:r.status,finalUrl:r.url,type:r.headers.get('content-type')||''}); await r.body?.cancel();}catch(e){results.push({url,status:null,error:e.name+': '+e.message});}}}
          await Promise.all(Array.from({length:12},worker));
          results.sort((a,b)=>a.url.localeCompare(b.url)); fs.writeFileSync('audit-output/links.json',JSON.stringify(results,null,2));
          const summary={total:results.length,ok:results.filter(x=>x.status>=200&&x.status<400).length,notFound:results.filter(x=>[404,410].includes(x.status)).length,forbidden:results.filter(x=>[401,403,429].includes(x.status)).length,serverError:results.filter(x=>x.status>=500).length,networkError:results.filter(x=>x.status==null).length,redirectCollisions:[]};
          const finals=new Map(); for(const r of results){if(!r.finalUrl||!(r.status>=200&&r.status<400))continue; const key=r.finalUrl.replace(/#.*$/,'').replace(/\/$/,''); const arr=finals.get(key)||[];arr.push(r.url);finals.set(key,arr);} summary.redirectCollisions=[...finals].filter(([,v])=>v.length>1).map(([finalUrl,urls])=>({finalUrl,urls}));
          fs.writeFileSync('audit-output/link-summary.json',JSON.stringify(summary,null,2));

          const base='https://na-t-to.github.io/law-article/'; const publicChecks=[];
          for(const p of ['index.html','articles.html','article.html','topics.html','reforms.html','data/manifest.js','data/schema.js','data/reform-policy.js','directory-page.js','styles.css']){try{const r=await fetch(base+p+'?audit='+Date.now(),{signal:AbortSignal.timeout(15000)}); const body=await r.text(); publicChecks.push({path:p,status:r.status,matchesCheckout:body===fs.readFileSync(p,'utf8'),length:body.length});}catch(e){publicChecks.push({path:p,status:null,error:e.message});}}
          fs.writeFileSync('audit-output/public.json',JSON.stringify(publicChecks,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-structure-audit-20260920
          path: audit-output
          retention-days: 7
