name: Weekly structure audit details
on:
  push:
    branches: [audit/structure-20260906-90c3]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture unresolved audit details
        run: |
          mkdir -p audit-output
          node scripts/validate-data.mjs > audit-output/validator.json 2> audit-output/validator-stderr.txt || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const c={window:{},URL,console};vm.createContext(c);
          vm.runInContext(fs.readFileSync('data/manifest.js','utf8'),c);
          for(const f of Object.values(c.window.LAW_INDEX_DATA_FILES).flat()) vm.runInContext(fs.readFileSync('data/'+f.split('?')[0],'utf8'),c);
          const topics=c.window.TOPIC_DATA||[], sources=c.window.SOURCE_DATA||[], articles=c.window.ARTICLE_DATA||[], updates=c.window.UPDATE_DATA||[], events=c.window.REFORM_EVENT_DATA||[];
          const eventForArticle=(article)=>{if(article.reformEventId)return events.find(e=>e.id===article.reformEventId)||null;const ps=article.primarySourceIds||[];const m=events.filter(e=>(e.articleIds||[]).includes(article.id)||(e.matchSourceIds||[]).some(id=>ps.includes(id)));return m.length===1?m[0]:null};
          const unmapped=articles.filter(a=>a.status==='adopted'&&!eventForArticle(a)&&(c.window.getLegalReformInfo?.(a,topics)||{}).isReform).map(a=>({id:a.id,title:a.title,publisher:a.publisher,publishedAt:a.publishedAt,collectedAt:a.collectedAt,relatedTopics:a.relatedTopics,relatedIssues:a.relatedIssues,primarySourceIds:a.primarySourceIds,reformStageAtPublication:a.reformStageAtPublication||null,reformStageSourceIds:a.reformStageSourceIds||[]}));
          const diverged=topics.filter(t=>t.lastUpdated!==t.lastVerified).map(t=>({slug:t.slug,title:t.title,lastUpdated:t.lastUpdated,lastVerified:t.lastVerified}));
          const selectedTopics=topics.filter(t=>['ai-governance-liability','ai-civil-liability'].includes(t.slug)).map(t=>({slug:t.slug,title:t.title,categories:t.categories,summary:t.summary,lastUpdated:t.lastUpdated,lastVerified:t.lastVerified,issueIds:(t.issues||[]).map(i=>i.id),issueTitles:(t.issues||[]).map(i=>i.title),sourceIds:t.sourceIds,articleIds:articles.filter(a=>(a.relatedTopics||[]).includes(t.slug)).map(a=>a.id)}));
          const unmappedSourceIds=[...new Set(unmapped.flatMap(a=>a.primarySourceIds||[]))];
          const sourceDetails=sources.filter(s=>unmappedSourceIds.includes(s.id)).map(s=>({id:s.id,title:s.title,type:s.type,typeLabel:s.typeLabel,authority:s.authority,publishedAt:s.publishedAt,url:s.url,topics:s.topics}));
          const eventDetails=events.map(e=>({id:e.id,title:e.title,eventType:e.eventType,lawId:e.lawId,lawLabel:e.lawLabel,effectiveDateStatus:e.effectiveDateStatus,effectiveDate:e.effectiveDate||null,effectiveDates:e.effectiveDates||[],effectiveDateNote:e.effectiveDateNote||null,effectiveDateSourceIds:e.effectiveDateSourceIds||[],sourceIds:e.sourceIds||[],matchSourceIds:e.matchSourceIds||[],relatedTopics:e.relatedTopics||[]}));
          fs.writeFileSync('audit-output/details.json',JSON.stringify({commit:process.env.GITHUB_SHA,diverged,unmapped,selectedTopics,sourceDetails,eventDetails},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-structure-audit-details
          path: audit-output
          retention-days: 3