name: Consolidate and validate LAW INDEX
on:
  push:
    branches: [audit/structure-20260905-v2]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate current data
        run: |
          node scripts/consolidate-data.mjs > consolidation.json
          node scripts/finalize-audit.mjs
      - name: Validate consolidated data
        run: |
          node scripts/validate-data.mjs > validator.out 2> validator.err
      - name: Run semantic structure audit
        run: |
          node scripts/audit-final.mjs > final-audit.json
      - name: Commit consolidated data to audit branch
        run: |
          git config user.name "LAW INDEX audit"
          git config user.email "actions@users.noreply.github.com"
          git add data scripts/validate-data.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Enforce canonical LAW INDEX data validation"
            git push origin HEAD:audit/structure-20260905-v2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-result
          path: |
            consolidation.json
            validator.out
            validator.err
            final-audit.json
          retention-days: 3
