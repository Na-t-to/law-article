name: Final duplicate consolidation
on:
  push:
    branches: [audit/final-dedupe-20260905]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge duplicate HTML/PDF article
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const c={window:{}};vm.createContext(c);
          for(const [f,n] of [['data/articles.js','ARTICLE_DATA'],['data/topics.js','TOPIC_DATA'],['data/updates.js','UPDATE_DATA'],['data/reforms.js','REFORM_EVENT_DATA']]) vm.runInContext(fs.readFileSync(f,'utf8'),c,{filename:f});
          const from='article-nagashima-whistleblower-retaliation-2025';
          const to='article-not-whistleblower-adverse-action-2025';
          const items=c.window.ARTICLE_DATA;
          const a=items.find(x=>x.id===to), b=items.find(x=>x.id===from);
          if(!a||!b) throw new Error(`expected duplicate pair missing: ${!!a}/${!!b}`);
          const uniq=xs=>[...new Set(xs||[])];
          for(const [k,v] of Object.entries(b)){
            if(Array.isArray(v)) a[k]=uniq([...(Array.isArray(a[k])?a[k]:[]),...v]);
            else if((a[k]===undefined||a[k]===null||a[k]==='')&&v!==undefined) a[k]=v;
            else if(['summary','whyImportant','audienceReason','whatChanged'].includes(k)&&String(v||'').length>String(a[k]||'').length) a[k]=v;
          }
          c.window.ARTICLE_DATA=c.window.ARTICLE_DATA.filter(x=>x.id!==from);
          const remap=v=>{if(Array.isArray(v))return [...new Set(v.map(remap))];if(v&&typeof v==='object'){for(const k of Object.keys(v))v[k]=remap(v[k]);return v}return v===from?to:v};
          c.window.TOPIC_DATA=remap(c.window.TOPIC_DATA);c.window.UPDATE_DATA=remap(c.window.UPDATE_DATA);c.window.REFORM_EVENT_DATA=remap(c.window.REFORM_EVENT_DATA);
          for(const [f,n] of [['data/articles.js','ARTICLE_DATA'],['data/topics.js','TOPIC_DATA'],['data/updates.js','UPDATE_DATA'],['data/reforms.js','REFORM_EVENT_DATA']]) fs.writeFileSync(f,`window.${n} = ${JSON.stringify(c.window[n],null,2)};\n`);
          NODE
          node scripts/validate-data.mjs
      - name: Commit
        run: |
          git config user.name "LAW INDEX audit"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Merge duplicate HTML and PDF article records"
          git push origin HEAD:audit/final-dedupe-20260905
