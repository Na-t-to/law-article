name: Post-publish audit 2026-09-20
on:
  push:
    branches: [audit/validate-cleanup-20260920]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compare published files with validated cleanup
        shell: bash
        run: |
          mkdir -p public-output/files
          BASE='https://na-t-to.github.io/law-article/'
          : > public-output/checks.tsv
          for f in index.html articles.html article.html topics.html reforms.html update.html data/manifest.js data/articles-run231.js topics/consumer-law-digital-contract-review.html topics/customer-harassment-2026.html; do
            out="public-output/files/${f//\//-}"
            curl -fsSL "$BASE$f?audit=15ad35442187472dc5ef7f6d7c0fa9694e6809fb" -o "$out"
            if cmp -s "$f" "$out"; then printf '%s\t200\tmatch\n' "$f" >> public-output/checks.tsv; else printf '%s\t200\tMISMATCH\n' "$f" >> public-output/checks.tsv; exit 5; fi
          done
      - name: Render desktop and mobile smoke checks
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const browser=await chromium.launch({headless:true}); const checks=[];
          for(const [label,viewport] of [['desktop',{width:1440,height:900}],['mobile',{width:390,height:844}]]){
            const ctx=await browser.newContext({viewport});
            for(const p of ['index.html','articles.html','topics.html','reforms.html','topics/customer-harassment.html','topics/patent-network-inventions-infringement-review-2026.html']){
              const page=await ctx.newPage();const errors=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(e.message));
              const r=await page.goto('https://na-t-to.github.io/law-article/'+p+'?audit=15ad35442187472dc5ef7f6d7c0fa9694e6809fb',{waitUntil:'networkidle',timeout:30000});
              const state=await page.evaluate(()=>({title:document.title,nav:[...document.querySelectorAll('.main-nav a')].map(a=>a.textContent.trim()),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,h1:document.querySelector('h1,h2')?.textContent?.trim()||'',missing:!!document.querySelector('.missing-topic')}));
              await page.screenshot({path:`public-output/${label}-${p.replaceAll('/','-')}.png`,fullPage:true});checks.push({label,path:p,status:r?.status(),errors,state});await page.close();
            } await ctx.close();
          } await browser.close(); fs.writeFileSync('public-output/browser-checks.json',JSON.stringify(checks,null,2));
          if(checks.some(x=>x.status!==200||x.errors.length||x.state.overflow||x.state.missing||x.state.nav.join('|')!=='新着|記事一覧|テーマ|法改正'))process.exit(6);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postpublish-audit-20260920
          path: public-output
          retention-days: 3
