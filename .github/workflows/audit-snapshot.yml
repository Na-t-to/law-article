name: Audit snapshot
on:
  push:
    branches: [audit/structure-20260913-current]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: law-index-audit-snapshot-20260913
          path: |
            README.md
            *.html
            *.js
            *.css
            data
            scripts
            topics
          retention-days: 7
