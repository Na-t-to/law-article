name: Promote LAW INDEX staged data

on:
  push:
    branches:
      - main
    paths:
      - "incoming/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: law-index-ingest
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Promote staged data and validate
        run: node scripts/promote-incoming.mjs

      - name: Check patch
        run: git diff --check

      - name: Commit promoted data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote LAW INDEX staged data"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/pages/builds" >/dev/null
          target="${{ steps.commit.outputs.sha }}"
          for attempt in $(seq 1 36); do
            latest="$(gh api "repos/${{ github.repository }}/pages/builds/latest")"
            status="$(printf '%s' "$latest" | jq -r '.status // empty')"
            commit="$(printf '%s' "$latest" | jq -r '.commit // empty')"
            echo "Pages build: status=$status commit=$commit target=$target"
            if [ "$commit" = "$target" ] && [ "$status" = "built" ]; then
              exit 0
            fi
            if [ "$commit" = "$target" ] && [ "$status" = "errored" ]; then
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for GitHub Pages build." >&2
          exit 1

      - name: Verify public LAW INDEX
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://na-t-to.github.io/law-article"
          stamp="$(date +%s)"
          index="$(curl -fsSL "$base/index.html?v=$stamp")"
          printf '%s' "$index" | grep -q 'data/bootstrap.js?v=1'
          manifest="$(curl -fsSL "$base/data/manifest.js?v=$stamp")"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            name="$(basename "$file")"
            printf '%s' "$manifest" | grep -Fq "$name"
            curl -fsSL "$base/$file?v=$stamp" >/dev/null
          done < <(git diff --name-only HEAD^ HEAD | grep -E '^data/(topics|sources|updates|reforms|articles)-.+\.js$' || true)
