name: Promote LAW INDEX staged data

on:
  push:
    branches:
      - main
    paths:
      - "incoming/.ready"
      - "scripts/**"
      - "data/bootstrap.js"
      - ".github/workflows/promote-law-index.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: read
  actions: read

concurrency:
  group: law-index-ingest-v2
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test promotion safety
        run: node --test scripts/test-*.mjs

      - name: Check staged readiness
        id: batch
        run: |
          if [ -f incoming/.ready ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate existing publication
        if: steps.batch.outputs.ready != 'true'
        run: node scripts/validate-data.mjs

      - name: Promote staged data and validate
        id: promote
        if: steps.batch.outputs.ready == 'true'
        run: node scripts/promote-incoming.mjs

      - name: Preserve rejected batch and report failure
        if: failure()
        run: |
          echo "::error::Promotion failed. Public data and the incoming batch are preserved. Inspect the validation log, repair the same batch, and retry."

      - name: Check patch
        if: steps.promote.outcome == 'success'
        run: git diff --check

      - name: Commit promoted data
        if: steps.promote.outcome == 'success'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data topics incoming
          git add -- *.html
          git commit -m "Promote LAW INDEX staged data"
          if ! git push origin HEAD:main; then
            echo "::error::main changed while validating. Nothing was force-pushed. Re-run this workflow to validate against latest main."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for automatic GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.commit.outputs.sha }}"
          for attempt in $(seq 1 42); do
            latest="$(gh api "repos/${{ github.repository }}/pages/builds/latest" 2>/dev/null || true)"
            status="$(printf '%s' "$latest" | jq -r '.status // empty' 2>/dev/null || true)"
            commit="$(printf '%s' "$latest" | jq -r '.commit // empty' 2>/dev/null || true)"
            echo "Pages build: status=$status commit=$commit target=$target"
            if [ "$commit" = "$target" ] && [ "$status" = "built" ]; then
              exit 0
            fi
            if [ "$status" = "built" ] && [ -n "$commit" ] && [ "$commit" != "$target" ]; then
              # A newer successful build may include this publication. Do not wait
              # forever for an intermediate Pages build that was superseded.
              if git fetch --no-tags origin "$commit" && git merge-base --is-ancestor "$target" "$commit"; then
                echo "Publication is included in newer successful Pages build $commit."
                exit 0
              fi
            fi
            if [ "$commit" = "$target" ] && [ "$status" = "errored" ]; then
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for GitHub Pages build." >&2
          exit 1

      - name: Verify public LAW INDEX
        if: success()
        run: node scripts/verify-public.mjs
